name: flutter_ai_toolkit_example
description: >-
  Sample apps showing off various features of the Flutter AI Toolkit.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_ai_toolkit:
    path: ..
  cupertino_icons: ^2.0.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  go_router: ^18.1.2
  uuid: ^4.6.0
  path: ^1.9.1
  path_provider: ^2.1.6
  flutter_markdown_plus: ^1.0.12
  google_fonts: '>=8.2.1 <9.0.0'
  future_builder_ex: ^5.0.0
  split_view: ^3.2.2
  firebase_core: ^5.1.0
  firebase_ai: ^5.1.0
  cross_file: ^0.3.5+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/recipes_default.json
    - assets/halloween-bg.png
